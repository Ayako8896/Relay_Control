
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Relay Control</title>
  <style>
    body {
      background-color: black;
      color: #aaddff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .button {
      background-color: #222;
      border: 2px solid #aaddff;
      border-radius: 10px;
      padding: 15px 30px;
      margin: 10px;
      font-size: 20px;
      cursor: pointer;
      color: #aaddff;
      transition: 0.3s;
    }
    .button:hover {
      background-color: #aaddff;
      color: black;
    }
  </style>
</head>
<body>
  <h1>Relay Pulse Control</h1>
  <button class="button" onclick="pulseRelay()">Pulse Relay</button>

  <script>
    function pulseRelay() {
      fetch('https://api.thingspeak.com/update?api_key=Y9UZSEKQI52AY8TO&field1=1')
        .then(response => {
          if (response.ok) {
            alert('Relay pulsed!');
          } else {
            alert('Error sending request');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('Request failed');
        });
    }
  </script>
</body>
</html>
